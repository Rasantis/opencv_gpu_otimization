# Multi-câmera: cada câmera = uma config (fonte, modelo, solução) + o que fazer
# com ela: exibir janela, salvar eventos (csv/xlsx/jsonl) e/ou streamar (RTMP->WebRTC).
#   gpuvideo analytics examples/cameras.yaml --seconds 20
#   gpuvideo analytics examples/cameras.yaml --display   # força janela p/ todas
#   gpuvideo analytics examples/cameras.yaml --metrics-port 9108  # /metrics (Prometheus)
defaults:
  model: yolo11n.pt
  classes: [person]
  proc_max_side: 960
  # annotate é ligado automaticamente quando há display/record/stream
  # robustez (24/7): fontes ao vivo (rtsp/rtmp) que caem reconectam sozinhas
  # com backoff. Por câmera você pode ajustar:
  #   reconnect: true   # (padrão) reconecta fonte ao vivo que cai
  #   loop: false       # true = re-abre arquivos no fim (teste/replay)
  #   half: auto        # FP16 na GPU (auto=on em CUDA). Em deploy, aponte um
  #                     # engine TensorRT: model: yolo11n.engine (ver: gpuvideo export)
  # batching: câmeras com a MESMA assinatura (model/imgsz/device/classes) podem
  # dividir UM modelo e rodar a detecção em batch (~2.9x de throughput agregado):
  #   batch: true         # liga o detector compartilhado p/ esta câmera
  #   batch_size: 8       # frames por forward (teto)
  #   batch_wait_ms: 8    # janela p/ acumular o batch (latência vs throughput)
  # desacople decode/inferência: decodifica a fps cheio (vídeo suave p/ display/
  # gravação/stream) mas só infere a infer_fps (contagem/dwell/heatmap não precisam
  # de 30fps). Corte de custo ~ (decode_fps / infer_fps). Frames pulados reusam os
  # últimos tracks; em modo event-only o frame pulado nem é entregue.
  #   infer_fps: 5        # inferência alvo (omita = infere todo frame)
  # keep-on-GPU: NVDEC -> GpuMat -> tensor torch (cópia GPU->GPU, sem PCIe) -> YOLO.
  # O frame nunca desce pra CPU (em event-only); só as caixas descem. ~2.7x de
  # throughput em GPU PCIe-bound. Requer cudacodec (NVDEC).
  #   keep_on_gpu: true   # arquivo/RTSP suportado pelo NVDEC, sem janela (event-only)
  # keep_on_gpu + batch juntos: as câmeras submetem tensores CUDA e o batcher faz
  # torch.cat (agrupa por shape) -> 1 forward, tudo na GPU. Pico de eficiência por
  # GPU em frotas grandes/PCIe-bound (em GPU decode/compute-bound o ganho some).

cameras:
  # contagem -> salva num EXCEL, sem janela, sem stream (produção, FPS cheio)
  - id: entrada
    source: 15974169_3840_2160_25fps.mp4
    solution: {type: counting, line: [[0, 0.55], [1, 0.55]], name: fluxo}
    events: {format: xlsx, path: relatorios/contagem.xlsx}

  # invasão -> EXIBE janela ao vivo + salva CSV + STREAMA pro MediaMTX
  - id: area-restrita
    source: 15974169_3840_2160_25fps.mp4
    solution: {type: intrusion, zone: [[0.02, 0.25], [0.35, 0.25], [0.35, 0.95], [0.02, 0.95]], name: restrito}
    display: true
    events: {format: csv, path: relatorios/invasao.csv}
    stream: rtmp://localhost:1935/area-restrita     # abre em http://localhost:8889/area-restrita

  # permanência -> só eventos em JSONL (sem janela, sem stream)
  - id: fila-caixa
    source: 15974169_3840_2160_25fps.mp4
    solution: {type: dwell, zone: [[0.4, 0.3], [0.95, 0.3], [0.95, 0.95], [0.4, 0.95]], name: fila, alert_s: 6}
    events: {format: jsonl, path: relatorios/permanencia.jsonl}
